name: Windows Maintenance Build

on:
  workflow_dispatch:

concurrency:
  group: windows-maintenance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Full regression suite
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl file libayatana-appindicator3-dev \
            libgtk-3-dev libjavascriptcoregtk-4.1-dev libnm-dev \
            librsvg2-dev libsoup-3.0-dev libssl-dev \
            libwebkit2gtk-4.1-dev patchelf pkg-config wget xdg-utils

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: sidecars/cockpit-cliproxy/go.mod
          cache-dependency-path: sidecars/cockpit-cliproxy/go.sum

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: maintenance-regression
          cache-on-failure: true

      - name: Install frontend dependencies
        run: npm ci

      - name: Check generated metadata and translations
        run: |
          npm run sync-version
          node scripts/check_locales.cjs
          git diff --exit-code

      - name: Run frontend and release tests
        run: |
          npm run typecheck
          npm test
          npm run test:release

      - name: Run Go sidecar tests
        run: npm run test:go

      - name: Build embedded frontend
        run: npm run build

      - name: Run full Rust test suite
        run: |
          unset NVM_BIN NVM_DIR FNM_MULTISHELL_PATH FNM_DIR ASDF_DATA_DIR
          cargo test -p cockpit-tools --lib quick_config_without_model_overrides -- --test-threads=1 --nocapture
          cargo test --workspace --all-targets -- --test-threads=1

  windows-package:
    name: Windows installer
    needs: regression
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: sidecars/cockpit-cliproxy/go.mod
          cache-dependency-path: sidecars/cockpit-cliproxy/go.sum

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: maintenance-windows
          cache-on-failure: true

      - name: Install frontend dependencies
        run: npm ci

      - name: Build embedded frontend
        run: npm run build

      - name: Compile Windows Rust tests
        working-directory: src-tauri
        run: cargo test --lib --no-run

      - name: Build unsigned NSIS installer
        shell: pwsh
        run: |
          npx tauri build --ci --config src-tauri/tauri.ci.conf.json --bundles nsis 2>&1 |
            Tee-Object -FilePath build-windows.log
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cockpit-tools-windows-build-log
          retention-days: 14
          if-no-files-found: warn
          path: build-windows.log

      - name: Install and verify embedded frontend
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-ChildItem target/release/bundle/nsis/*.exe | Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer is missing' }
          $installDir = Join-Path $env:RUNNER_TEMP 'cockpit-maintenance-smoke'
          $install = Start-Process -FilePath $installer.FullName -ArgumentList '/S', "/D=$installDir" -WindowStyle Hidden -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer failed: $($install.ExitCode)" }
          $executable = Get-ChildItem -LiteralPath $installDir -Filter 'cockpit*tools.exe' | Select-Object -First 1
          if (-not $executable) { throw 'Installed application is missing' }
          $env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS = '--remote-debugging-port=49231'
          $app = Start-Process -FilePath $executable.FullName -WorkingDirectory $installDir -WindowStyle Hidden -PassThru
          try {
            $targets = @()
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              Start-Sleep -Seconds 1
              if ($app.HasExited) { throw "Installed app exited: $($app.ExitCode)" }
              try { $targets = @(Invoke-RestMethod 'http://127.0.0.1:49231/json/list') } catch { continue }
              if ($targets | Where-Object { $_.type -eq 'page' -and $_.url -match '(tauri://localhost|https?://tauri.localhost)' }) { break }
            }
            $pages = @($targets | Where-Object { $_.type -eq 'page' })
            $pages | Select-Object type,url | ConvertTo-Json | Set-Content frontend-smoke.json
            if ($pages | Where-Object { $_.url -match '(localhost|127\.0\.0\.1):1420' }) { throw 'Release app opened the development server' }
            if (-not ($pages | Where-Object { $_.url -match '(tauri://localhost|https?://tauri.localhost)' })) { throw 'Embedded frontend did not open' }
          } finally {
            if (-not $app.HasExited) { Stop-Process -Id $app.Id -Force }
          }

      - name: Upload installed frontend evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cockpit-tools-windows-frontend-smoke
          retention-days: 14
          if-no-files-found: warn
          path: frontend-smoke.json

      - name: Upload Windows installer and executable
        uses: actions/upload-artifact@v4
        with:
          name: cockpit-tools-windows-maintenance
          retention-days: 14
          if-no-files-found: error
          path: |
            target/release/bundle/nsis/*.exe
            target/release/cockpit-tools.exe
            target/release/cockpit_tools.exe
