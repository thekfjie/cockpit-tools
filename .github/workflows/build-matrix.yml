name: Windows Maintenance Build

on:
  workflow_dispatch:
    inputs:
      skip_regression:
        description: Skip the Linux regression suite and build the Windows package only.
        required: false
        default: false
        type: boolean

concurrency:
  group: windows-maintenance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Full regression suite
    if: ${{ !inputs.skip_regression }}
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl file libayatana-appindicator3-dev \
            libgtk-3-dev libjavascriptcoregtk-4.1-dev libnm-dev \
            librsvg2-dev libsoup-3.0-dev libssl-dev \
            libwebkit2gtk-4.1-dev patchelf pkg-config wget xdg-utils

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: sidecars/cockpit-cliproxy/go.mod
          cache-dependency-path: sidecars/cockpit-cliproxy/go.sum

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: maintenance-regression
          cache-on-failure: true

      - name: Install frontend dependencies
        run: npm ci

      - name: Check generated metadata and translations
        run: |
          npm run sync-version
          node scripts/check_locales.cjs
          git diff --exit-code

      - name: Run frontend and release tests
        run: |
          npm run typecheck
          npm test
          npm run test:release

      - name: Run Go sidecar tests
        run: npm run test:go

      - name: Build embedded frontend
        run: npm run build

      - name: Run full Rust test suite
        run: |
          unset NVM_BIN NVM_DIR FNM_MULTISHELL_PATH FNM_DIR ASDF_DATA_DIR
          cargo test --workspace --all-targets -- --test-threads=1

  windows-package:
    name: Windows installer
    needs: regression
    if: ${{ always() && (needs.regression.result == 'success' || needs.regression.result == 'skipped') }}
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: sidecars/cockpit-cliproxy/go.mod
          cache-dependency-path: sidecars/cockpit-cliproxy/go.sum

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: maintenance-windows
          cache-on-failure: true

      - name: Install frontend dependencies
        run: npm ci

      - name: Build embedded frontend
        run: npm run build

      - name: Run frontend regression checks on Windows
        shell: pwsh
        run: |
          npm run typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $releaseTests = @(Get-ChildItem -LiteralPath 'scripts/release' -Filter '*.test.cjs' -File | Select-Object -ExpandProperty FullName)
          node --test @releaseTests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/check_locales.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run Windows model catalog regressions
        shell: pwsh
        run: |
          $env:COCKPIT_CATALOG_CONTRACT_OUTPUT = Join-Path $env:RUNNER_TEMP 'catalog-contract-fixtures'
          cargo test -p cockpit-tools --lib --no-run
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $testExe = Get-ChildItem -Path 'target/debug/deps' -Filter 'antigravity_cockpit_tools_lib-*.exe' -File | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $testExe) { throw 'Rust model regression executable was not produced.' }
          $sdkRoot = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits/10/bin'
          $manifestTool = Get-ChildItem -Path "$sdkRoot/*/x64/mt.exe" -File | Sort-Object FullName -Descending | Select-Object -First 1
          $manifestPath = Join-Path $env:RUNNER_TEMP 'cockpit-model-test.manifest'
          @'
          <?xml version="1.0" encoding="UTF-8" standalone="yes"?>
          <assembly xmlns="urn:schemas-microsoft-com:asm.v1" manifestVersion="1.0">
            <assemblyIdentity type="win32" name="Cockpit.ModelCatalogTests" version="1.0.0.0" processorArchitecture="amd64" />
            <dependency>
              <dependentAssembly>
                <assemblyIdentity type="win32" name="Microsoft.Windows.Common-Controls" version="6.0.0.0" processorArchitecture="*" publicKeyToken="6595b64144ccf1df" language="*" />
              </dependentAssembly>
            </dependency>
          </assembly>
          '@ | Set-Content -LiteralPath $manifestPath -Encoding utf8
          & $manifestTool.FullName -nologo -manifest $manifestPath "-outputresource:$($testExe.FullName);#1"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $embeddedManifest = Join-Path $env:RUNNER_TEMP 'cockpit-model-test.embedded.manifest'
          & $manifestTool.FullName -nologo "-inputresource:$($testExe.FullName);#1" "-out:$embeddedManifest"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-Content -LiteralPath $embeddedManifest -Raw) -notmatch 'Microsoft.Windows.Common-Controls') {
            throw 'Rust test executable is missing the Common Controls v6 manifest.'
          }
          $env:PATH = "$(Resolve-Path 'target/debug/deps');$(Resolve-Path 'target/debug');$env:PATH"
          # Running Cargo again can relink the test executable and discard its manifest.
          & $testExe.FullName catalog --test-threads=1
          if ($LASTEXITCODE -ne 0) {
            $testExit = $LASTEXITCODE
            $testExe = Get-ChildItem -Path 'target/debug/deps' -Filter 'antigravity_cockpit_tools_lib-*.exe' -File | Sort-Object LastWriteTime -Descending | Select-Object -First 1
            $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
            $vsRoot = & $vswhere -latest -property installationPath
            $dumpbin = Get-ChildItem -Path "$vsRoot/VC/Tools/MSVC/*/bin/Hostx64/x64/dumpbin.exe" -File | Sort-Object FullName -Descending | Select-Object -First 1
            $imports = & $dumpbin.FullName /imports $testExe.FullName
            $imports | Out-File windows-test-imports.log
            Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          public static class CatalogLoaderProbe {
            [DllImport("kernel32", CharSet = CharSet.Unicode, SetLastError = true)] public static extern IntPtr LoadLibraryW(string name);
            [DllImport("kernel32", CharSet = CharSet.Ansi, ExactSpelling = true, SetLastError = true)] public static extern IntPtr GetProcAddress(IntPtr module, string name);
            [DllImport("kernel32")] public static extern bool FreeLibrary(IntPtr module);
          }
          '@
            $module = [IntPtr]::Zero
            $library = ''
            foreach ($line in $imports) {
              if ($line -match '^\s+(\S+\.dll)\s*$') {
                if ($module -ne [IntPtr]::Zero) { [void][CatalogLoaderProbe]::FreeLibrary($module) }
                $library = $Matches[1]
                $module = [CatalogLoaderProbe]::LoadLibraryW($library)
                if ($module -eq [IntPtr]::Zero) { Write-Output "LOAD FAILED: $library" }
              } elseif ($module -ne [IntPtr]::Zero -and $line -match '^\s+[0-9A-Fa-f]{1,4}\s+([A-Za-z_?][^\s]*)\s*$') {
                $symbol = $Matches[1]
                if ([CatalogLoaderProbe]::GetProcAddress($module, $symbol) -eq [IntPtr]::Zero) { Write-Output "MISSING ENTRY: $library!$symbol" }
              }
            }
            if ($module -ne [IntPtr]::Zero) { [void][CatalogLoaderProbe]::FreeLibrary($module) }
            exit $testExit
          }
          & $testExe.FullName model_slots --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $testExe.FullName legacy_catalog_alias --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $testExe.FullName responses_sync_catalog_with_custom_models --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check generated catalogs with Codex app-server on Windows
        shell: pwsh
        run: |
          $codexExecutable = Join-Path $env:RUNNER_TEMP 'catalog-contract-codex.exe'
          Invoke-WebRequest 'https://github.com/openai/codex/releases/download/rust-v0.160.0/codex-x86_64-pc-windows-msvc.exe' -OutFile $codexExecutable
          node scripts/check-codex-model-catalog.cjs $codexExecutable (Join-Path $env:RUNNER_TEMP 'catalog-contract-fixtures')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item -LiteralPath $codexExecutable -Force

      - name: Build unsigned NSIS installer
        shell: pwsh
        run: |
          npx tauri build --ci --config src-tauri/tauri.ci.conf.json --bundles nsis 2>&1 |
            Tee-Object -FilePath build-windows.log
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cockpit-tools-windows-build-log
          retention-days: 14
          if-no-files-found: warn
          path: |
            build-windows.log
            windows-test-imports.log

      - name: Collect Windows installer and executable
        shell: pwsh
        run: |
          $outputDir = Join-Path $env:RUNNER_TEMP 'cockpit-tools-windows-maintenance'
          Remove-Item -LiteralPath $outputDir -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $outputDir -Force | Out-Null

          $installers = Get-ChildItem -Path 'target/release/bundle/nsis' -Filter '*.exe' -File
          if ($installers.Count -ne 1) {
            throw "Expected exactly one NSIS installer, found $($installers.Count)."
          }
          Copy-Item -LiteralPath $installers[0].FullName -Destination $outputDir

          $executable = @(
            'target/release/cockpit-tools.exe',
            'target/release/cockpit_tools.exe'
          ) | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $executable) {
            throw 'Cockpit Tools executable was not produced.'
          }
          Copy-Item -LiteralPath $executable -Destination $outputDir

      - name: Upload Windows installer and executable
        uses: actions/upload-artifact@v4
        with:
          name: cockpit-tools-windows-maintenance
          retention-days: 14
          if-no-files-found: error
          path: ${{ runner.temp }}/cockpit-tools-windows-maintenance/*
