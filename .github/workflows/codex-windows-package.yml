name: Codex Windows Package

on:
  push:
    branches:
      - "feature/build-matrix/codex-key-models"

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows package
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: sidecars/cockpit-cliproxy/go.mod
          cache-dependency-path: sidecars/cockpit-cliproxy/go.sum

      - name: Install frontend dependencies
        run: npm install

      - name: Build unsigned Windows package
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx tauri build --ci --config src-tauri/tauri.ci.conf.json

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: cockpit-tools-windows-1.3.59
          if-no-files-found: error
          path: target/release/bundle
