name: PR 2598 validation

on:
  push:
    branches:
      - "ci-validation-pr2598"

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf pkg-config libsoup-3.0-dev javascriptcoregtk-4.1 libjavascriptcoregtk-4.1-dev libnm-dev xdg-utils
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - run: cargo test instance_configuration_save --manifest-path src-tauri/Cargo.toml --lib
      - run: cargo test quick_config_catalog_only_context_preservation --manifest-path src-tauri/Cargo.toml --lib
      - run: npm install
      - run: npm run test:rust:core
